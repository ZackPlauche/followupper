[project]
name = "followupper"
version = "0.1.0"
description = "Automated follow-up application for managing client communications across multiple platforms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.0.0",
    "djangorestframework>=3.14.0",
    "django-cors-headers>=4.3.0",
    "apscheduler>=3.10.0",
    "cryptography>=41.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "emoji>=2.8.0",
    "pytz>=2024.1",
    "python-dateutil>=2.8.2",
    "python-gmail",
    "codementorapi",
    "pyotp>=2.9.0",
    "qrcode>=8.2",
    "dj-database-url>=2.1.0",
    "click>=8.1.0",
    "psycopg2-binary>=2.9.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[tool.uv.sources]
python-gmail = { git = "https://github.com/ZackPlauche/python-gmail.git" }
codementorapi = { git = "https://github.com/ZackPlauche/codementorapi.git" }
